name: Deploy production frontend to Bunny on main push

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      BUILD_DIR: dist

      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
      BUNNY_STORAGE_REGION: ${{ secrets.BUNNY_STORAGE_REGION }}
      BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_SPA_FALLBACK_PATH: ${{ secrets.BUNNY_SPA_FALLBACK_PATH }}

      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_APPLE_CLIENT_ID: ${{ secrets.VITE_APPLE_CLIENT_ID }}
      VITE_APPLE_REDIRECT_URI: ${{ secrets.VITE_APPLE_REDIRECT_URI }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_URL }}

      VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory '$BUILD_DIR' not found."
            exit 1
          fi

          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "index.html not found inside '$BUILD_DIR'."
            exit 1
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve Bunny storage zone ID
        id: zone
        shell: bash
        run: |
          set -euo pipefail

          ZONE_ID="$(
            curl --fail --silent --show-error \
              --request GET \
              --url "https://api.bunny.net/storagezone" \
              --header "AccessKey: ${BUNNY_API_KEY}" \
            | jq -r --arg ZONE_NAME "$BUNNY_STORAGE_ZONE" '
                if type == "array" then
                  (.[] | select(.Name == $ZONE_NAME) | .Id) // empty
                else
                  (.Items[] | select(.Name == $ZONE_NAME) | .Id) // empty
                end
              ' \
            | head -n 1
          )"

          if [ -z "${ZONE_ID:-}" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Could not resolve Bunny storage zone ID for zone: $BUNNY_STORAGE_ZONE"
            exit 1
          fi

          echo "Resolved storage zone ID: $ZONE_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Configure Bunny SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.bunny.net/storagezone/${{ steps.zone.outputs.zone_id }}" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data @- <<EOF
          {
            "Custom404FilePath": "${BUNNY_SPA_FALLBACK_PATH}",
            "Rewrite404To200": true
          }
          EOF

          echo "Bunny SPA fallback configured."

      - name: "Ensure AASA edge rules (Content-Type: application/json)"
        shell: bash
        run: |
          set -euo pipefail

          # Apple's Universal Links validator requires the association file to
          # be served as application/json. Bunny derives Content-Type from the
          # file extension, so an extension-less AASA is served as octet-stream
          # no matter what the upload sends. These edge rules override the
          # header at the CDN edge. Idempotent: stale AASA rules are removed
          # first, unrelated rules are left untouched.
          PZ="https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}"
          AUTH=(-H "AccessKey: ${BUNNY_API_KEY}" -H "Content-Type: application/json")

          zone=$(curl --fail --silent --show-error "${AUTH[@]}" "$PZ" || echo "{}")
          echo "$zone" | jq -r '.EdgeRules[]? | select(
            (((.Triggers // []) | map(((.PatternMatches // []) + [.Parameter1]) | join(" ")) | join(" ")) | contains("apple-app-site"))) | .Guid' \
            | while read -r guid; do
                [ -n "$guid" ] || continue
                curl --fail --silent --show-error -X DELETE "${AUTH[@]}" "$PZ/edgerules/$guid" >/dev/null 2>&1 \
                  && echo "Removed stale AASA edge rule: $guid" || echo "WARN: could not delete stale rule $guid"
              done

          curl --fail --silent --show-error "${AUTH[@]}" \
            --request POST --url "$PZ/edgerules/addOrUpdate" --data @- >/dev/null <<'EOF' \
            && echo "AASA edge rule (.well-known) written." || echo "WARN: failed to write .well-known rule"
          {
            "ActionType": 5,
            "ActionParameter1": "Content-Type",
            "ActionParameter2": "application/json",
            "TriggerMatchingType": 1,
            "Enabled": true,
            "Description": "AASA content-type (.well-known)",
            "Triggers": [
              {
                "Type": 0,
                "PatternMatchingType": 0,
                "Parameter1": null,
                "PatternMatches": ["https://xilolo.com/.well-known/apple-app-site-association", "http://xilolo.com/.well-known/apple-app-site-association", "https://www.xilolo.com/.well-known/apple-app-site-association", "http://www.xilolo.com/.well-known/apple-app-site-association"]
              }
            ]
          }
          EOF

          curl --fail --silent --show-error "${AUTH[@]}" \
            --request POST --url "$PZ/edgerules/addOrUpdate" --data @- >/dev/null <<'EOF' \
            && echo "AASA edge rule (root) written." || echo "WARN: failed to write root rule"
          {
            "ActionType": 5,
            "ActionParameter1": "Content-Type",
            "ActionParameter2": "application/json",
            "TriggerMatchingType": 1,
            "Enabled": true,
            "Description": "AASA content-type (root)",
            "Triggers": [
              {
                "Type": 0,
                "PatternMatchingType": 0,
                "Parameter1": null,
                "PatternMatches": ["https://xilolo.com/apple-app-site-association", "http://xilolo.com/apple-app-site-association", "https://www.xilolo.com/apple-app-site-association", "http://www.xilolo.com/apple-app-site-association"]
              }
            ]
          }
          EOF

      # A deploy is only safe if a half-finished one cannot be served. That means:
      #   1. hashed assets first (nobody points at them yet), the HTML shell last;
      #   2. every upload retried, because one connection reset must not kill the run;
      #   3. old files pruned only AFTER the new build is fully in place;
      #   4. the shell cached briefly, the hashed assets cached forever;
      #   5. the result verified file by file, so a partial upload fails the job loudly.
      - name: Upload build to Bunny Storage (assets first, index.html last)
        shell: bash
        env:
          CURL_RETRY: "--retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 15 --max-time 300"
        run: |
          set -euo pipefail

          STORAGE_HOST="${BUNNY_STORAGE_REGION}.storage.bunnycdn.com"
          BASE="https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}"

          put() {
            local file="$1" rel="$2" cache="$3" content_type

            if [[ "$rel" == ".well-known/apple-app-site-association" || "$rel" == "apple-app-site-association" ]]; then
              # Apple's validator requires application/json for the extension-less AASA.
              content_type="application/json"
            else
              content_type="$(file --brief --mime-type "$file")"
            fi

            echo "Uploading: $rel"
            # shellcheck disable=SC2086
            curl --fail --silent --show-error $CURL_RETRY \
              --request PUT \
              --url "${BASE}/${rel}" \
              --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              --header "Content-Type: ${content_type}" \
              --header "Cache-Control: ${cache}" \
              --upload-file "$file"
          }

          echo "1/3 hashed assets (immutable, safe to appear before the shell points at them)"
          find "$BUILD_DIR/assets" -type f -print0 | while IFS= read -r -d '' file; do
            put "$file" "${file#"$BUILD_DIR"/}" "public, max-age=31536000, immutable"
          done

          echo "2/3 static root files (never index.html)"
          find "$BUILD_DIR" -type f ! -path "*/assets/*" ! -name "index.html" -print0 | while IFS= read -r -d '' file; do
            put "$file" "${file#"$BUILD_DIR"/}" "public, max-age=3600"
          done

          echo "3/3 index.html (last, and never cached: it is the pointer to everything above)"
          put "$BUILD_DIR/index.html" "index.html" "no-cache, must-revalidate"

      - name: Verify every built file is actually in storage
        shell: bash
        run: |
          set -euo pipefail

          STORAGE_HOST="${BUNNY_STORAGE_REGION}.storage.bunnycdn.com"
          BASE="https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}"

          # Ask the object store, not the CDN: the SPA fallback answers unknown paths with
          # index.html and a 200, which would make a missing chunk look perfectly healthy.
          missing=0
          checked=0

          while IFS= read -r file; do
            rel="${file#"$BUILD_DIR"/}"
            code=$(curl --silent --output /dev/null --write-out '%{http_code}' \
              --retry 3 --retry-delay 2 --retry-all-errors --max-time 30 \
              --range 0-0 \
              --url "${BASE}/${rel}" \
              --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}")

            if [ "$code" != "206" ] && [ "$code" != "200" ]; then
              echo "MISSING ($code): $rel"
              missing=$((missing + 1))
            fi
            checked=$((checked + 1))
          done < <(find "$BUILD_DIR" -type f)

          echo "Checked ${checked} files, ${missing} missing."

          if [ "$missing" -gt 0 ]; then
            echo "::error::${missing} of ${checked} files are not in storage. index.html was not switched over, so the old site is still being served."
            exit 1
          fi

      - name: Purge Bunny CDN cache
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --request POST \
            --url "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'

          echo "Bunny CDN cache purged."

      - name: Prune files that are no longer part of the build
        shell: bash
        run: |
          set -euo pipefail

          STORAGE_HOST="${BUNNY_STORAGE_REGION}.storage.bunnycdn.com"

          # Runs after the new build is verified, so a failure here leaves a working site.
          EXISTING=$(curl --silent --show-error --retry 3 --retry-all-errors \
            --request GET \
            --url "https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/" \
            --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
            || echo "[]")

          if [ -z "$EXISTING" ] || [ "$EXISTING" = "null" ]; then
            echo "No listing available. Skipping prune."
            exit 0
          fi

          echo "$EXISTING" | jq -r '.[]? | select(.IsDirectory == false) | .ObjectName' | while read -r name; do
            [ -z "$name" ] && continue
            # Never delete the shell here: it is the pointer to the files just verified.
            [ "$name" = "index.html" ] && continue

            if [ ! -f "$BUILD_DIR/$name" ]; then
              echo "Pruning: $name"
              curl --silent --show-error --retry 3 --retry-all-errors \
                --request DELETE \
                --url "https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/${name}" \
                --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
                || echo "Could not prune $name (skipping)"
            fi
          done

          echo "Prune complete."

      - name: Deployment complete
        run: echo "Production deployment complete."
