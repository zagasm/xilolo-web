name: Deploy production frontend to Bunny on main push

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production-main
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: production

    env:
      BUILD_DIR: dist

      BUNNY_STORAGE_ZONE: ${{ secrets.BUNNY_STORAGE_ZONE }}
      BUNNY_STORAGE_PASSWORD: ${{ secrets.BUNNY_STORAGE_PASSWORD }}
      BUNNY_STORAGE_REGION: ${{ secrets.BUNNY_STORAGE_REGION }}
      BUNNY_PULL_ZONE_ID: ${{ secrets.BUNNY_PULL_ZONE_ID }}
      BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
      BUNNY_SPA_FALLBACK_PATH: ${{ secrets.BUNNY_SPA_FALLBACK_PATH }}

      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_APPLE_CLIENT_ID: ${{ secrets.VITE_APPLE_CLIENT_ID }}
      VITE_APPLE_REDIRECT_URI: ${{ secrets.VITE_APPLE_REDIRECT_URI }}
      VITE_API_BASE_URL: ${{ secrets.VITE_API_URL }}

      VITE_REVERB_APP_KEY: ${{ secrets.VITE_REVERB_APP_KEY }}
      VITE_REVERB_HOST: ${{ secrets.VITE_REVERB_HOST }}
      VITE_REVERB_PORT: ${{ secrets.VITE_REVERB_PORT }}
      VITE_REVERB_SCHEME: ${{ secrets.VITE_REVERB_SCHEME }}

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Show deployment info
        run: |
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Event: ${{ github.event_name }}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Verify build output exists
        run: |
          if [ ! -d "$BUILD_DIR" ]; then
            echo "Build directory '$BUILD_DIR' not found."
            exit 1
          fi

          if [ ! -f "$BUILD_DIR/index.html" ]; then
            echo "index.html not found inside '$BUILD_DIR'."
            exit 1
          fi

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Resolve Bunny storage zone ID
        id: zone
        shell: bash
        run: |
          set -euo pipefail

          ZONE_ID="$(
            curl --fail --silent --show-error \
              --request GET \
              --url "https://api.bunny.net/storagezone" \
              --header "AccessKey: ${BUNNY_API_KEY}" \
            | jq -r --arg ZONE_NAME "$BUNNY_STORAGE_ZONE" '
                if type == "array" then
                  (.[] | select(.Name == $ZONE_NAME) | .Id) // empty
                else
                  (.Items[] | select(.Name == $ZONE_NAME) | .Id) // empty
                end
              ' \
            | head -n 1
          )"

          if [ -z "${ZONE_ID:-}" ] || [ "$ZONE_ID" = "null" ]; then
            echo "Could not resolve Bunny storage zone ID for zone: $BUNNY_STORAGE_ZONE"
            exit 1
          fi

          echo "Resolved storage zone ID: $ZONE_ID"
          echo "zone_id=$ZONE_ID" >> "$GITHUB_OUTPUT"

      - name: Configure Bunny SPA fallback
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.bunny.net/storagezone/${{ steps.zone.outputs.zone_id }}" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data @- <<EOF
          {
            "Custom404FilePath": "${BUNNY_SPA_FALLBACK_PATH}",
            "Rewrite404To200": true
          }
          EOF

          echo "Bunny SPA fallback configured."

      - name: "Ensure AASA edge rules (Content-Type: application/json)"
        shell: bash
        run: |
          set -euo pipefail

          # Apple's Universal Links validator requires the association file to
          # be served as application/json. Bunny derives Content-Type from the
          # file extension, so an extension-less AASA is served as octet-stream
          # no matter what the upload sends. These edge rules override the
          # header at the CDN edge. Idempotent: stale AASA rules are removed
          # first, unrelated rules are left untouched.
          PZ="https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}"
          AUTH=(-H "AccessKey: ${BUNNY_API_KEY}" -H "Content-Type: application/json")

          zone=$(curl --fail --silent --show-error "${AUTH[@]}" "$PZ" || echo "{}")
          echo "$zone" | jq -r '.EdgeRules[]? | select(
            (((.Triggers // []) | map(((.PatternMatches // []) + [.Parameter1]) | join(" ")) | join(" ")) | contains("apple-app-site"))) | .Guid' \
            | while read -r guid; do
                [ -n "$guid" ] || continue
                curl --fail --silent --show-error -X DELETE "${AUTH[@]}" "$PZ/edgerules/$guid" >/dev/null 2>&1 \
                  && echo "Removed stale AASA edge rule: $guid" || echo "WARN: could not delete stale rule $guid"
              done

          curl --fail --silent --show-error "${AUTH[@]}" \
            --request POST --url "$PZ/edgerules/addOrUpdate" --data @- >/dev/null <<'EOF' \
            && echo "AASA edge rule (.well-known) written." || echo "WARN: failed to write .well-known rule"
          {
            "ActionType": 5,
            "ActionParameter1": "Content-Type",
            "ActionParameter2": "application/json",
            "TriggerMatchingType": 1,
            "Enabled": true,
            "Description": "AASA content-type (.well-known)",
            "Triggers": [
              {
                "Type": 0,
                "PatternMatchingType": 0,
                "Parameter1": null,
                "PatternMatches": ["https://xilolo.com/.well-known/apple-app-site-association", "http://xilolo.com/.well-known/apple-app-site-association", "https://www.xilolo.com/.well-known/apple-app-site-association", "http://www.xilolo.com/.well-known/apple-app-site-association"]
              }
            ]
          }
          EOF

          curl --fail --silent --show-error "${AUTH[@]}" \
            --request POST --url "$PZ/edgerules/addOrUpdate" --data @- >/dev/null <<'EOF' \
            && echo "AASA edge rule (root) written." || echo "WARN: failed to write root rule"
          {
            "ActionType": 5,
            "ActionParameter1": "Content-Type",
            "ActionParameter2": "application/json",
            "TriggerMatchingType": 1,
            "Enabled": true,
            "Description": "AASA content-type (root)",
            "Triggers": [
              {
                "Type": 0,
                "PatternMatchingType": 0,
                "Parameter1": null,
                "PatternMatches": ["https://xilolo.com/apple-app-site-association", "http://xilolo.com/apple-app-site-association", "https://www.xilolo.com/apple-app-site-association", "http://www.xilolo.com/apple-app-site-association"]
              }
            ]
          }
          EOF

      - name: Remove old files from Bunny Storage root
        shell: bash
        run: |
          set -euo pipefail

          STORAGE_HOST="${BUNNY_STORAGE_REGION}.storage.bunnycdn.com"

          echo "Listing existing root objects in Bunny Storage..."

          EXISTING_ITEMS=$(curl --silent --show-error \
            --request GET \
            --url "https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/" \
            --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
            || echo "[]")

          if [ -z "$EXISTING_ITEMS" ] || [ "$EXISTING_ITEMS" = "null" ]; then
            echo "No existing items found or failed to fetch. Skipping cleanup."
            exit 0
          fi

          echo "$EXISTING_ITEMS" | jq -c '.[]?' | while read -r item; do
            OBJECT_NAME=$(echo "$item" | jq -r '.ObjectName')
            IS_DIR=$(echo "$item" | jq -r '.IsDirectory')

            if [ -z "$OBJECT_NAME" ] || [ "$OBJECT_NAME" = "null" ]; then
              continue
            fi

            if [ "$IS_DIR" = "true" ]; then
              echo "Skipping directory: $OBJECT_NAME"
              continue
            fi

            echo "Deleting file: $OBJECT_NAME"

            curl --silent --show-error \
              --request DELETE \
              --url "https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/${OBJECT_NAME}" \
              --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              || echo "Failed to delete $OBJECT_NAME (skipping)"
          done

          echo "Cleanup complete."

      - name: Upload build files to Bunny Storage
        shell: bash
        run: |
          set -euo pipefail

          STORAGE_HOST="${BUNNY_STORAGE_REGION}.storage.bunnycdn.com"

          echo "Uploading files from $BUILD_DIR to https://$STORAGE_HOST/$BUNNY_STORAGE_ZONE/"

          find "$BUILD_DIR" -type f | while read -r file; do
            rel_path="${file#"$BUILD_DIR"/}"
            # Apple's Universal Links validator requires the association file
            # to be served as application/json. The AASA has no file extension,
            # so force the content type instead of relying on `file` detection
            # (which varies by runner and previously shipped octet-stream).
            if [[ "$rel_path" == ".well-known/apple-app-site-association" || "$rel_path" == "apple-app-site-association" ]]; then
              content_type="application/json"
            else
              content_type="$(file --brief --mime-type "$file")"
            fi

            echo "Uploading: $rel_path"
            curl --fail --silent --show-error \
              --request PUT \
              --url "https://${STORAGE_HOST}/${BUNNY_STORAGE_ZONE}/${rel_path}" \
              --header "AccessKey: ${BUNNY_STORAGE_PASSWORD}" \
              --header "Content-Type: ${content_type}" \
              --upload-file "$file"
          done

      - name: Purge Bunny CDN cache
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            --request POST \
            --url "https://api.bunny.net/pullzone/${BUNNY_PULL_ZONE_ID}/purgeCache" \
            --header "AccessKey: ${BUNNY_API_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}'

          echo "Bunny CDN cache purged."

      - name: Deployment complete
        run: echo "Production deployment complete."
