<head>

  <!-- ── Icons ──────────────────────────────────────────────────────────────
       /favicon.ico is the request every crawler and browser makes first; it
       was a 404 on production, which is why search results still showed the
       old mark. The .ico carries the waveform mark (readable at 16px), the
       larger icons carry the full wordmark. -->
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#F3F2F0" />
  <meta name="msapplication-TileColor" content="#F3F2F0" />

  <!-- Primary Meta Tags -->
  <title>Xilolo — Live Events, Tickets &amp; Creators</title>
  <meta name="title" content="Xilolo — Live Events, Tickets &amp; Creators" />
  <meta name="description"
    content="Creators have something to offer. Audience have something to discover. Xilolo brings them together — find live events near you, buy tickets in seconds, host your own show, and get paid directly." />

    content="Xilolo, live events, event tickets, buy tickets online, host an event, event platform Nigeria, concerts, festivals, comedy shows, online events, creators, organisers" />
  <meta name="author" content="Xilolo Technologies" />

  <meta name="language" content="English" />

    content="Creators have something to offer. Audience have something to discover. We bring them together." />
  <meta property="og:image" content="https://xilolo.com/og-image.png" />

  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Xilolo — Creators have something to offer. Audience have something to discover." />
  <meta property="og:site_name" content="Xilolo" />
  <meta property="og:locale" content="en_US" />

  <!-- Legacy icon fonts. New work uses lucide-react; these stay only for the
       handful of older screens that still carry `fa-` classes (marketing,

    crossorigin="anonymous" referrerpolicy="no-referrer" />


  <!-- Structured data lives here as well as in the SEO component so a crawler
       that does not execute the SPA still sees who this site is. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": "Organization",
        "@id": "https://xilolo.com/#organization",
        "name": "Xilolo",
        "legalName": "Xilolo Technologies",
        "url": "https://xilolo.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://xilolo.com/icon-512.png",
          "width": 512,
          "height": 512

        "description": "Xilolo is where creators host live events and audiences discover them. Sell tickets, go live, and get paid directly.",

        "address": {
          "@type": "PostalAddress",
          "streetAddress": "16192 Coastal Highway",
          "addressLocality": "Lewes",
          "addressRegion": "DE",
          "postalCode": "19958",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://web.facebook.com/xilolohq",
          "https://x.com/xilolo_hq",
          "https://www.instagram.com/xilolo_hq",
          "https://www.youtube.com/@xilolo_hq",
          "https://www.tiktok.com/@xilolo_hq"
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://xilolo.com/#website",
        "url": "https://xilolo.com",
        "name": "Xilolo",
        "publisher": { "@id": "https://xilolo.com/#organization" },
        "inLanguage": "en",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://xilolo.com/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    ]
  }
  </script>
